// Subset of Android's KeyEvent codes that an Android TV will accept over the
// remote v2 channel. Numeric values match `android.view.KeyEvent` so they
// round-trip with the firmware's input dispatcher unchanged. The full list
// has ~250 entries; this file keeps the ones the UI actually maps to.
//
// Add entries lazily as the UI grows — every code we omit here just becomes
// an unsupported AndroidTvKey, never a runtime failure.
syntax = "proto3";

package atv.remote;

option java_package = "io.github.ddagunts.screencast.proto.atv";
option java_outer_classname = "RemoteKeyCodes";
option java_multiple_files = true;

enum RemoteKeyCode {
    KEYCODE_UNKNOWN = 0;
    KEYCODE_SOFT_LEFT = 1;
    KEYCODE_SOFT_RIGHT = 2;
    KEYCODE_HOME = 3;
    KEYCODE_BACK = 4;

    // Typing keys. Numeric values are android.view.KeyEvent.KEYCODE_*
    // unchanged. Kept for documentation even though text entry goes
    // through RemoteImeBatchEdit — the TV's input dispatcher silently
    // drops letter keycodes injected over this channel.
    KEYCODE_0 = 7;
    KEYCODE_1 = 8;
    KEYCODE_2 = 9;
    KEYCODE_3 = 10;
    KEYCODE_4 = 11;
    KEYCODE_5 = 12;
    KEYCODE_6 = 13;
    KEYCODE_7 = 14;
    KEYCODE_8 = 15;
    KEYCODE_9 = 16;
    KEYCODE_STAR = 17;
    KEYCODE_POUND = 18;

    KEYCODE_DPAD_UP = 19;
    KEYCODE_DPAD_DOWN = 20;
    KEYCODE_DPAD_LEFT = 21;
    KEYCODE_DPAD_RIGHT = 22;
    KEYCODE_DPAD_CENTER = 23;
    KEYCODE_VOLUME_UP = 24;
    KEYCODE_VOLUME_DOWN = 25;
    KEYCODE_POWER = 26;

    KEYCODE_A = 29; KEYCODE_B = 30; KEYCODE_C = 31; KEYCODE_D = 32;
    KEYCODE_E = 33; KEYCODE_F = 34; KEYCODE_G = 35; KEYCODE_H = 36;
    KEYCODE_I = 37; KEYCODE_J = 38; KEYCODE_K = 39; KEYCODE_L = 40;
    KEYCODE_M = 41; KEYCODE_N = 42; KEYCODE_O = 43; KEYCODE_P = 44;
    KEYCODE_Q = 45; KEYCODE_R = 46; KEYCODE_S = 47; KEYCODE_T = 48;
    KEYCODE_U = 49; KEYCODE_V = 50; KEYCODE_W = 51; KEYCODE_X = 52;
    KEYCODE_Y = 53; KEYCODE_Z = 54;
    KEYCODE_COMMA = 55;
    KEYCODE_PERIOD = 56;
    KEYCODE_ALT_LEFT = 57;
    KEYCODE_ALT_RIGHT = 58;
    KEYCODE_SHIFT_LEFT = 59;
    KEYCODE_SHIFT_RIGHT = 60;
    KEYCODE_TAB = 61;
    KEYCODE_SPACE = 62;

    // ENTER (66) is what soft keyboards emit on "Done"/"Submit". Some TVs
    // also accept DPAD_CENTER for confirming text input, but ENTER is the
    // keycode the on-screen IME normally fires for IME_ACTION_DONE — so
    // the IME bottom sheet's submit button uses this.
    KEYCODE_ENTER = 66;
    // Backspace. KEYCODE_DEL is the unfortunate Android name — it's the
    // *backspace* key, while forward-delete is KEYCODE_FORWARD_DEL.
    KEYCODE_DEL = 67;
    KEYCODE_GRAVE = 68;
    KEYCODE_MINUS = 69;
    KEYCODE_EQUALS = 70;
    KEYCODE_LEFT_BRACKET = 71;
    KEYCODE_RIGHT_BRACKET = 72;
    KEYCODE_BACKSLASH = 73;
    KEYCODE_SEMICOLON = 74;
    KEYCODE_APOSTROPHE = 75;
    KEYCODE_SLASH = 76;
    KEYCODE_AT = 77;
    KEYCODE_PLUS = 81;

    KEYCODE_MENU = 82;
    KEYCODE_NOTIFICATION = 83;
    KEYCODE_SEARCH = 84;
    KEYCODE_MEDIA_PLAY_PAUSE = 85;
    KEYCODE_MEDIA_STOP = 86;
    KEYCODE_MEDIA_NEXT = 87;
    KEYCODE_MEDIA_PREVIOUS = 88;
    KEYCODE_MEDIA_REWIND = 89;
    KEYCODE_MEDIA_FAST_FORWARD = 90;
    KEYCODE_MUTE = 91;
    KEYCODE_PAGE_UP = 92;
    KEYCODE_PAGE_DOWN = 93;
    KEYCODE_VOLUME_MUTE = 164;
    KEYCODE_INFO = 165;
    KEYCODE_CHANNEL_UP = 166;
    KEYCODE_CHANNEL_DOWN = 167;
    KEYCODE_GUIDE = 172;
    KEYCODE_BOOKMARK = 174;
    KEYCODE_CAPTIONS = 175;
    KEYCODE_SETTINGS = 176;
    KEYCODE_TV_POWER = 177;
    KEYCODE_TV_INPUT = 178;
    KEYCODE_MEDIA_AUDIO_TRACK = 222;
    KEYCODE_SLEEP = 223;
    KEYCODE_WAKEUP = 224;
    KEYCODE_PAIRING = 225;
    KEYCODE_MEDIA_TOP_MENU = 226;
}

enum RemoteDirection {
    REMOTE_DIRECTION_UNKNOWN = 0;
    START_LONG = 1;
    END_LONG = 2;
    SHORT = 3;
}
